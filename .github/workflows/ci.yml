name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
      - name: Tests
        run: npm test
      - name: Build bundle
        run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-chat-replica-bundle
          path: dist/*.tar.gz
          if-no-files-found: error
